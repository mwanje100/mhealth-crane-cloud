[package]
name = "mhealth"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mhealth"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
warp = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
